name: Preview checks

# When Vercel finishes a deployment (preview or production), run the end-to-end tests against it.
# If Vercel's deployment protection is on, add VERCEL_AUTOMATION_BYPASS_SECRET as a repository secret
# (Vercel → Project → Settings → Deployment Protection → Protection Bypass for Automation).
on:
  deployment_status:

permissions:
  contents: read

jobs:
  e2e:
    if: github.event.deployment_status.state == 'success'
    name: End-to-end tests on the deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_QUOTE: ${{ secrets.ONECLICK_API_KEY != '' && '1' || '' }}
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-deployment
          path: playwright-report/
          retention-days: 7
