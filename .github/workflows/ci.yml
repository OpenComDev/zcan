name: CI

# Runs on every push and pull request: type-check, lint, unit tests, then a production build
# exercised by the end-to-end tests in a real browser.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Type-check, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    name: Build and end-to-end tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional: with the 1Click key as a repository secret, the suite also requests a real (dry) swap quote.
      ONECLICK_API_KEY: ${{ secrets.ONECLICK_API_KEY }}
      E2E_QUOTE: ${{ secrets.ONECLICK_API_KEY != '' && '1' || '' }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:extension
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: zcan-extension
          path: extension/zcan-extension.zip
          retention-days: 30
